<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalhe da avaliação · CineMatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header data-nav="historico"></header>

  <main class="page" data-detalhe-avaliacao>
    <div class="page-header">
      <a class="back-link" href="avaliacoes.html">←  Minhas avaliações</a>
      <h1 class="page-title">Detalhe da avaliação</h1>
    </div>

    <section class="card review-full">
      <span data-poster></span>
      <div class="details">
        <div class="movie">
          <h2>Interestelar</h2>
          <p class="meta">2014 · Ficção científica · 2h 49min</p>
          <p class="director">Direção de Christopher Nolan</p>
        </div>
        <div class="divider"></div>
        <div class="personal">
          <div class="head">
            <strong>Sua avaliação</strong>
            <span>24 de outubro de 2026</span>
          </div>
          <div class="stars small" aria-label="Nota 4 de 5">
            <span class="star on"><i data-icon="rating-star-30"></i></span>
            <span class="star on"><i data-icon="rating-star-30"></i></span>
            <span class="star on"><i data-icon="rating-star-30"></i></span>
            <span class="star on"><i data-icon="rating-star-30"></i></span>
            <span class="star"><i data-icon="rating-star-30"></i></span>
            <span class="value">  4,0</span>
          </div>
        </div>
        <div class="comment">
          <small>SUA OPINIÃO</small>
          <p>“Emocionante! A história e a trilha sonora são inesquecíveis.”</p>
        </div>
        <div class="actions">
          <a class="btn" href="filme.html" data-editar>Editar avaliação</a>
          <a class="text-link" href="avaliacoes.html" style="align-self: flex-start">Voltar ao histórico →</a>
        </div>
      </div>
    </section>
  </main>

  <footer data-footer></footer>

  <script src="js/icons.js"></script>
  <script src="js/catalogo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
