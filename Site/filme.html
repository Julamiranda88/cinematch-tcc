<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filme · CineMatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header data-nav="inicio"></header>

  <main class="page gap-16" data-filme>
    <div class="page-header">
      <a class="back-link" href="resultados.html">←  Resultados da pesquisa</a>
      <span class="badge">Etapa 1 de 6 · Avaliar filme</span>
      <h1 class="page-title"></h1>
      <p class="page-desc"></p>
    </div>

    <section class="movie-detail">
      <aside class="movie-sheet">
        <span data-poster></span>
        <div class="extra">
          <span class="community"></span>
          <button class="bookmark-btn" type="button" aria-label="Salvar filme" aria-pressed="false"><i data-icon="bookmark-20"></i></button>
        </div>
      </aside>

      <div class="movie-body">
        <div class="synopsis-block">
          <h2></h2>
          <p></p>
          <p class="credits"></p>
        </div>

        <div class="divider"></div>

        <form class="rate-block" data-rating>
          <h2>Como você avalia este filme?</h2>
          <div class="stars" role="group" aria-label="Nota de 1 a 5 estrelas">
            <button class="star" type="button" aria-label="1 estrela"><i data-icon="rating-star-32"></i></button>
            <button class="star" type="button" aria-label="2 estrelas"><i data-icon="rating-star-32"></i></button>
            <button class="star" type="button" aria-label="3 estrelas"><i data-icon="rating-star-32"></i></button>
            <button class="star" type="button" aria-label="4 estrelas"><i data-icon="rating-star-32"></i></button>
            <button class="star" type="button" aria-label="5 estrelas"><i data-icon="rating-star-32"></i></button>
            <span class="value"></span>
          </div>
          <div class="field">
            <label for="opiniao">Sua opinião (opcional)</label>
            <div class="input textarea">
              <textarea id="opiniao" maxlength="500" placeholder="Um filme emocionante sobre o amor e a humanidade..."></textarea>
            </div>
          </div>
          <p class="char-count">0/500</p>
          <div class="actions">
            <button class="btn btn-primary" type="submit" style="width: 230px">Enviar avaliação</button>
            <a class="btn" href="javascript:history.back()">Cancelar</a>
          </div>
        </form>

        <p class="flow-hint">Ao enviar: avaliação registrada → explorar sugestões → escolher e votar.</p>
      </div>
    </section>
  </main>

  <footer data-footer></footer>

  <script src="js/icons.js"></script>
  <script src="js/catalogo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
