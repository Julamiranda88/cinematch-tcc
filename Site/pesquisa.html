<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Encontre seu próximo filme · CineMatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header data-nav="inicio"></header>

  <main class="page">
    <div class="page-header">
      <h1 class="page-title">Encontre seu próximo filme</h1>
      <p class="page-desc">Busque por títulos e descubra novas histórias.</p>
    </div>

    <form class="search-bar" data-search role="search">
      <button class="search-submit" type="submit" aria-label="Pesquisar"><i data-icon="search-20"></i></button>
      <input type="search" name="q" placeholder="Pesquisar filmes, gêneros ou diretores" aria-label="Pesquisar filmes" autofocus>
      <button class="clear" type="button" aria-label="Limpar busca" hidden><i data-icon="x-20"></i></button>
    </form>

    <section class="center-state">
      <div class="round-symbol"><i data-icon="search-36"></i></div>
      <h2>Busque mundos incríveis</h2>
      <p style="width: 470px; max-width: 100%">Digite o nome de um filme para começar e encontre sua próxima história favorita.</p>
      <a class="btn" href="index.html" style="width: 180px">Voltar</a>
    </section>
  </main>

  <footer data-footer></footer>

  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
